<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Precision Counter Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Mencegah scroll yang tidak disengaja saat mengetuk canvas di ponsel */
        canvas {
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- Top Bar / Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-calculator text-indigo-400 text-lg"></i>
            <h1 class="font-bold text-base tracking-wide text-white">Smart Mobile Counter</h1>
        </div>
        <div class="bg-indigo-600 text-white font-extrabold text-sm px-3 py-1 rounded-full shadow-inner flex items-center gap-1">
            <span class="text-xs font-normal opacity-80">Total:</span>
            <span id="counterResult">0</span>
        </div>
    </header>

    <!-- Main Workspace (Canvas Area) -->
    <main class="flex-grow flex flex-col items-center justify-center p-2 relative overflow-hidden bg-slate-950">
        
        <!-- Placeholder Saat Gambar Belum Diunggah -->
        <div id="placeholder" class="text-center text-slate-400 p-6 flex flex-col items-center justify-center">
            <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-3 text-indigo-400 text-2xl shadow-lg border border-slate-700">
                <i class="fa-solid fa-camera"></i>
            </div>
            <p class="text-sm font-semibold text-slate-300">Pilih / Ambil Foto Benda atau Kerumunan</p>
            <p class="text-xs text-slate-500 mt-1 max-w-xs">Gunakan tombol kamera/galeri di bawah untuk memuat gambar dari ponsel Anda.</p>
        </div>

        <!-- Canvas Container -->
        <div id="canvasWrapper" class="relative hidden w-full h-full flex items-center justify-center overflow-auto rounded-lg">
            <canvas id="canvas" class="max-w-full max-h-[70vh] object-contain shadow-2xl rounded border border-slate-800 cursor-pointer"></canvas>
        </div>

    </main>

    <!-- Bottom Mobile Toolbar -->
    <footer class="bg-slate-800 border-t border-slate-700 p-3 flex flex-col gap-2 shadow-2xl">
        
        <!-- Baris Tombol Kontrol / Mode -->
        <div class="grid grid-cols-4 gap-2">
            <!-- Ambil/Unggah Foto -->
            <label class="col-span-1 bg-indigo-600 active:bg-indigo-700 text-white rounded-lg p-2 flex flex-col items-center justify-center text-xs font-medium cursor-pointer shadow transition">
                <i class="fa-solid fa-image text-sm mb-0.5"></i>
                <span>Foto</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </label>

            <!-- Toggle Grid / Grid Density -->
            <button id="gridBtn" class="col-span-1 bg-slate-700 active:bg-slate-600 text-slate-200 rounded-lg p-2 flex flex-col items-center justify-center text-xs font-medium transition disabled:opacity-50" disabled>
                <i class="fa-solid fa-border-all text-sm mb-0.5 text-amber-400"></i>
                <span id="gridBtnText">Grid: Off</span>
            </button>

            <!-- Undo / Batalkan Titik -->
            <button id="undoBtn" class="col-span-1 bg-slate-700 active:bg-slate-600 text-slate-200 rounded-lg p-2 flex flex-col items-center justify-center text-xs font-medium transition disabled:opacity-50" disabled>
                <i class="fa-solid fa-rotate-left text-sm mb-0.5 text-blue-400"></i>
                <span>Undo</span>
            </button>

            <!-- Hapus / Reset -->
            <button id="resetBtn" class="col-span-1 bg-slate-700 active:bg-slate-600 text-slate-200 rounded-lg p-2 flex flex-col items-center justify-center text-xs font-medium transition disabled:opacity-50" disabled>
                <i class="fa-solid fa-trash-can text-sm mb-0.5 text-rose-400"></i>
                <span>Reset</span>
            </button>
        </div>

        <!-- Ukuran Marker sentuhan & Ekspor -->
        <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-700/50 text-xs">
            <div class="flex items-center gap-2 text-slate-400">
                <label>Ukuran Titik:</label>
                <input type="range" id="markerSize" min="3" max="15" value="6" class="w-24 accent-indigo-500">
            </div>
            <button id="exportBtn" class="text-indigo-400 font-semibold active:text-indigo-300 flex items-center gap-1 disabled:opacity-40" disabled>
                <i class="fa-solid fa-download"></i> Simpan Gambar
            </button>
        </div>

    </footer>

    <!-- Script Logika Aplikasi Mobile -->
    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const counterResult = document.getElementById('counterResult');
        const gridBtn = document.getElementById('gridBtn');
        const gridBtnText = document.getElementById('gridBtnText');
        const undoBtn = document.getElementById('undoBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const markerSizeInput = document.getElementById('markerSize');

        let img = new Image();
        let isImageLoaded = false;
        let points = [];
        let showGrid = false;
        let gridCols = 4; // Jumlah kolom grid density

        // Unggah Gambar dari Galeri atau Kamera Ponsel
        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    initCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function initCanvas() {
            placeholder.classList.add('hidden');
            canvasWrapper.classList.remove('hidden');

            // Set resolusi canvas sesuai resolusi asli foto
            canvas.width = img.width;
            canvas.height = img.height;

            points = [];
            isImageLoaded = true;
            
            gridBtn.disabled = false;
            undoBtn.disabled = false;
            resetBtn.disabled = false;
            exportBtn.disabled = false;

            redraw();
        }

        function redraw() {
            if (!isImageLoaded) return;

            // 1. Gambar ulang foto asli
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            // 2. Gambar Grid Density jika Diaktifkan
            if (showGrid) {
                drawGrid();
            }

            // 3. Gambar semua titik terhitung
            const radius = parseInt(markerSizeInput.value);
            points.forEach((pt, idx) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.9)'; // Warna merah terang
                ctx.fill();
                ctx.lineWidth = Math.max(1, radius / 3);
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Tampilkan nomor urut titik jika ukuran titik mencukupi
                if (radius >= 6) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.max(9, radius * 1.2)}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(idx + 1, pt.x, pt.y);
                }
            });

            counterResult.textContent = points.length;
        }

        // Gambar Kotak Grid Density untuk mempermudah perhitungan area demi area
        function drawGrid() {
            const cols = gridCols;
            const rows = Math.round(cols * (canvas.height / canvas.width));
            const cellW = canvas.width / cols;
            const cellH = canvas.height / rows;

            ctx.strokeStyle = 'rgba(251, 191, 36, 0.7)'; // Warna kuning transparan
            ctx.lineWidth = Math.max(2, canvas.width / 400);
            ctx.font = `bold ${Math.max(14, canvas.width / 40)}px sans-serif`;
            ctx.fillStyle = 'rgba(251, 191, 36, 0.9)';

            let gridNum = 1;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * cellW;
                    const y = r * cellH;
                    ctx.strokeRect(x, y, cellW, cellH);
                    ctx.fillText(String.fromCharCode(65 + r) + (c + 1), x + 10, y + 25);
                    gridNum++;
                }
            }
        }

        // Menangani Sentuhan (Touch) / Klik pada Ponsel
        canvas.addEventListener('pointerdown', (e) => {
            if (!isImageLoaded) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            // Tambah titik hitung baru
            points.push({ x, y });
            redraw();
        });

        // Toggle Grid Density
        gridBtn.addEventListener('click', () => {
            if (!showGrid) {
                showGrid = true;
                gridBtnText.textContent = "Grid: On";
                gridBtn.classList.add('bg-amber-600', 'text-white');
            } else {
                showGrid = false;
                gridBtnText.textContent = "Grid: Off";
                gridBtn.classList.remove('bg-amber-600', 'text-white');
            }
            redraw();
        });

        // Pengatur Ukuran Titik
        markerSizeInput.addEventListener('input', redraw);

        // Undo Titik Terakhir
        undoBtn.addEventListener('click', () => {
            if (points.length > 0) {
                points.pop();
                redraw();
            }
        });

        // Reset Semua Titik
        resetBtn.addEventListener('click', () => {
            if (confirm("Hapus semua titik penanda?")) {
                points = [];
                redraw();
            }
        });

        // Simpan / Ekspor Gambar
        exportBtn.addEventListener('click', () => {
            if (!isImageLoaded) return;
            const link = document.createElement('a');
            link.download = `hasil-hitung-${points.length}-objek.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
